name: Verify portable Windows ZIP on fresh host
on:
  push:
    branches: [ci/windows-sdk-probe]
permissions:
  contents: read
  actions: read
jobs:
  installed:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FabSTEP-Windows-x86_64
          path: D:\candidate
          github-token: ${{ github.token }}
          run-id: 44827530073
      - name: Verify the extracted portable archive
        shell: pwsh
        run: |
          $zip = Get-Item 'D:\candidate\FabSTEP-1.0.0-Windows-x86_64.zip'
          Get-FileHash $zip
          Expand-Archive $zip 'D:\fabstep-portable'
          python -c "from pathlib import Path; import runpy,tempfile; r=runpy.run_path('scripts/release-windows.py'); r['smoke'](Path(r'D:\fabstep-portable\FabSTEP-1.0.0-Windows-x86_64'),Path(tempfile.mkdtemp()))"
