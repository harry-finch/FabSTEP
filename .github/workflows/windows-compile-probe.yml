name: Probe Windows C++ ABI compilation
on:
  push:
    branches: [ci/windows-sdk-probe]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: exe
        with:
          path: D:\probe-executables
          key: windows-smoke-250fe19-v1
      - name: Build desktop and smoke with MSVC
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP occt.zip
          curl.exe -fsSL --retry 3 -o $archive https://github.com/Open-Cascade-SAS/OCCT/releases/download/V7_9_3/opencascade-7.9.3-vc14-64-combined.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive).Hash -ne "afbef3457fbc4a2bdca0608e0fe284392f51e4c2c42ccbfb9df7168d8e4eb9b3") { throw "SDK digest" }
          7z x -y "-o$env:RUNNER_TEMP" $archive | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:OCCT_ROOT = Join-Path $env:RUNNER_TEMP opencascade-7.9.3-vc14-64
          $env:CARGO_TARGET_DIR = "D:\fabstep-target"
          npm --prefix ui ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix ui run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ('${{ steps.exe.outputs.cache-hit }}' -ne 'true') {
            cargo build --release --locked --manifest-path crates/fabstep-desktop/Cargo.toml --features custom-protocol
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            cargo build --release --locked -p fabstep-cli
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $dst = New-Item -ItemType Directory D:\probe-executables
            Copy-Item "$env:CARGO_TARGET_DIR\release\fabstep.exe" "$dst\fabstep-cli.exe"
            Copy-Item "$env:CARGO_TARGET_DIR\release\fabstep-desktop.exe" "$dst\FabSTEP.exe"
          }
      - uses: actions/cache/save@v4
        if: steps.exe.outputs.cache-hit != 'true'
        with:
          path: D:\probe-executables
          key: windows-smoke-250fe19-v1
      - name: Smoke Windows applications
        shell: pwsh
        run: |
          $env:OCCT_ROOT = Join-Path $env:RUNNER_TEMP opencascade-7.9.3-vc14-64
          $base = "$env:RUNNER_TEMP\3rdparty-vc14-64"
          $dirs = Get-ChildItem $base -Filter *.dll -File -Recurse | ForEach-Object DirectoryName | Sort-Object -Unique
          $env:PATH = "$env:OCCT_ROOT\win64\vc14\bin;" + ($dirs -join ";") + ";" + $env:PATH
          python -c "from pathlib import Path; import runpy,tempfile; r=runpy.run_path('scripts/release-windows.py'); r['smoke'](Path(r'D:\probe-executables'), Path(tempfile.mkdtemp()))"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/release-notices.py D:\probe-notices
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
