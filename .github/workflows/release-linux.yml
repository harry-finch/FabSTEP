name: Package Linux amd64
on:
  push:
    branches: [ci/linux-package-probe]
    paths:
      - 'crates/**'
      - 'ui/**'
      - 'fixtures/**'
      - 'packaging/**'
      - 'Cargo.*'
      - 'LICENSE'
      - 'scripts/release-linux*'
      - 'scripts/release-notices.py'
      - 'scripts/package-macos.py'
      - '.github/workflows/release-linux.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Prepare clean runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git xvfb xauth xdotool dbus-x11 python3 openbox x11-utils imagemagick tesseract-ocr-eng fonts-dejavu-core
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 44821906667
          github-token: ${{ github.token }}
          name: linux-package-candidate
          path: /tmp/fabstep-package
      - name: Install package and check the desktop and native STEP reimport
        run: |
          apt-get install -y /tmp/fabstep-package/*.deb
          bash scripts/release-linux-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FabSTEP-Linux-amd64
          path: /tmp/fabstep-package/*.deb
          if-no-files-found: error
