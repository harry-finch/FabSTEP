name: Package Linux amd64
on:
  push:
    branches: [release/v1.0.0]
    paths:
      - 'crates/**'
      - 'ui/**'
      - 'fixtures/**'
      - 'packaging/**'
      - 'Cargo.*'
      - 'LICENSE'
      - 'scripts/release-linux*'
      - 'scripts/release-notices.py'
      - 'scripts/package-macos.py'
      - '.github/workflows/release-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_BUILD_JOBS: 3
    steps:
      - name: Install native development packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git pkg-config \
            libocct-data-exchange-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev python3 dpkg-dev xz-utils
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.10.0'
      - name: Install Rust and build the Debian package
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain 1.88.0
          . "$HOME/.cargo/env"
          bash scripts/release-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-package-candidate
          path: artifacts/linux/*.deb
          if-no-files-found: error

  qualify:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Prepare clean runtime
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git xvfb xauth xdotool dbus-x11 python3
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-package-candidate
          path: /tmp/fabstep-package
      - name: Install package and check the desktop and native STEP reimport
        run: |
          apt-get install -y /tmp/fabstep-package/*.deb
          bash scripts/release-linux-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FabSTEP-Linux-amd64
          path: /tmp/fabstep-package/*.deb
          if-no-files-found: error
