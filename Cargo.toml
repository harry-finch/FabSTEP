[workspace]
resolver = "3"
members = ["crates/fabstep-core", "crates/fabstep-import", "crates/fabstep-cad", "crates/fabstep-verify", "crates/fabstep-app", "crates/fabstep-cli"]
exclude = ["crates/fabstep-desktop"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Stéphane Muller"]
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fabstep-core = { path = "crates/fabstep-core" }
fabstep-import = { path = "crates/fabstep-import" }
fabstep-cad = { path = "crates/fabstep-cad" }
fabstep-app = { path = "crates/fabstep-app" }
fabstep-verify = { path = "crates/fabstep-verify" }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
